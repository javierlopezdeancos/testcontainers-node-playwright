name: Test
run-name: "Ubuntu v22.04 / Node v24.18.0 / Runtime Docker"

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.sha }}"
  cancel-in-progress: true

jobs:
  test:
    name: "Runner Ubuntu v22.04 LTS :: Node v24.18.0 LTS :: Runtime Docker"
    runs-on: ubuntu-22.04
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install NodeJS v24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: "npm"
      - name: Install dependencies
        run: npm ci --omit=optional
      - name: Run tests
        run: npm run test:ci
